# Caps Lock is Hyper when held and Right Arrow when tapped.
# This matches the active Superkey behavior on the personal Mac while leaving
# the physical Windows/Super key untouched.

[ids]

*

[main]

capslock = overload(hyper, right)

# Retain the Superkey editing preset for toggling Caps Lock.
leftshift+rightshift = capslock

# keyd modifier layers apply these modifiers to any key not explicitly
# remapped in the layer: Control + Meta/Super + Alt + Shift.
[hyper:C-M-A-S]
