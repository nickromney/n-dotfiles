# Personal Hyper aliases for Omarchy.
#
# Caps Lock emits this exact modifier set through keyd. Omarchy's native
# physical Super bindings remain unchanged because Hyprland matches the full
# modifier combination.
$hyper = SUPER CTRL ALT SHIFT

# Compress the Mac's nine named workspaces into five laptop workspaces.
# W/I: web and work; T/Y: terminal, Cursor, and development; brackets:
# communication; O/P: documents and productivity; U: utilities.
bindd = $hyper, W, Hyper: web/work workspace, workspace, 1
bindd = $hyper, I, Hyper: web/work workspace, workspace, 1
bindd = $hyper, T, Hyper: terminal/code workspace, workspace, 2
bindd = $hyper, Y, Hyper: terminal/code workspace, workspace, 2
bindd = $hyper, bracketleft, Hyper: communication workspace, workspace, 3
bindd = $hyper, bracketright, Hyper: communication workspace, workspace, 3
bindd = $hyper, O, Hyper: documents/productivity workspace, workspace, 4
bindd = $hyper, P, Hyper: documents/productivity workspace, workspace, 4
bindd = $hyper, U, Hyper: utilities workspace, workspace, 5

bindd = $hyper, H, Hyper: former workspace, workspace, previous

# Preserve the AeroSpace move-mode muscle memory without replacing Omarchy's
# native Super + Shift + Arrow bindings.
bindd = $hyper, semicolon, Hyper: move mode, submap, hyper-move

submap = hyper-move
bindd = , H, Move window left, swapwindow, l
bindd = , J, Move window down, swapwindow, d
bindd = , K, Move window up, swapwindow, u
bindd = , L, Move window right, swapwindow, r
bindd = , F, Toggle full screen, fullscreen, 0
bindd = , T, Toggle floating/tiling, togglefloating,
bindd = , escape, Leave Hyper move mode, submap, reset
bindd = , return, Leave Hyper move mode, submap, reset
submap = reset

# Hyper+F and Hyper+S are intentionally free for a future semantic Homerow
# equivalent. The current Wayland hint tools are coordinate grids, not true
# accessibility-element labels.
