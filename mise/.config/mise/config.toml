# Global mise configuration (stowed from n-dotfiles/mise/)
#
# Single source of truth for CLI tools and language runtimes on every
# machine. Cross-platform: the same list installs on macOS and Linux.
# macOS-only concerns (casks, fonts, Mac App Store apps) live in the
# Brewfile instead.
#
# AI CLIs (claude, codex, opencode, copilot) are deliberately absent:
# they self-update via their own native installers, so managing them
# here would fight the updater. See README.md.
#
# Apply with: mise install
# Update with: make update-all (from the repository root)

[settings]
# Wait seven days before selecting a release for a version range or `latest`.
# Exact version pins are exempt from the cooldown.
minimum_release_age = "7d"

[tools]
# Runtimes
node = "26.13.0"

# Shell and dev workflow
atuin = "18.24.5"
direnv = "2.38.2"
fd = "10.5.2"
gh = "2.103.3"
gitleaks = "8.30.1"
jq = "1.8.2"
lazygit = "0.66.2"
lefthook = "2.2.2"
ripgrep = "15.2.0"
starship = "1.27.0"
zoxide = "0.10.0"
yq = "4.54.2"
bun = "1.4.4"
"aqua:nushell/nushell" = "0.116.1" # not in mise's curated registry under a short name
"github:mufeedvh/code2prompt" = "4.2.0"

# Linting and testing (lefthook hooks, make lint, make test)
bats = "1.14.0"
markdownlint-cli2 = "0.24.0"
pipx = "1.18.16" # yamllint's pipx: backend needs this installed explicitly
shellcheck = "0.11.0"
yamllint = "1.38.0"

# Python tooling
ruff = "0.17.4"
uv = "0.13.7"

# Kubernetes
helm = "4.3.1"
k9s = "0.51.0"
kind = "0.33.0"
kubectl = "1.37.2"
kubectx = "0.11.0"
kubens = "0.11.0"
"github:vladimirvivien/ktop" = "0.6.1"
cilium-cli = "0.20.2"
"github:cilium/hubble" = "1.20.4"
argocd = "3.6.1"

# Infrastructure as code
terraform = "1.17.1"
terragrunt = "1.2.1"
tflint = "0.65.0"

# Containers and security
lazydocker = "0.25.2"
trivy = "0.76.2"
go = "1.27.3"
herdr = "0.9.5"
"npm:@openai/codex" = "0.167.0"
