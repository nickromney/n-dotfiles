# Global mise configuration (stowed from n-dotfiles/mise/)
#
# Single source of truth for CLI tools and language runtimes on every
# machine. Cross-platform: the same list installs on macOS and Linux.
# macOS-only concerns (casks, fonts, Mac App Store apps) live in the
# Brewfile instead.
#
# AI CLIs (claude, codex, opencode, copilot) are deliberately absent:
# they self-update via their own native installers, so managing them
# here would fight the updater. See README.md.
#
# Apply with: mise install
# Update with: mise upgrade

[tools]
# Runtimes
node = "24.19.0"

# Shell and dev workflow
atuin = "18.19.0"
direnv = "2.37.1"
fd = "10.4.2"
gh = "2.98.0"
gitleaks = "8.30.1"
jq = "1.8.2"
lazygit = "0.64.1"
lefthook = "2.1.11"
ripgrep = "15.2.0"
starship = "1.26.0"
zoxide = "0.10.0"
yq = "4.53.6"
bun = "1.4.0"
"aqua:nushell/nushell" = "0.115.0" # not in mise's curated registry under a short name
"github:mufeedvh/code2prompt" = "4.2.0"

# Linting and testing (lefthook hooks, make lint, make test)
bats = "1.14.0"
markdownlint-cli2 = "0.23.2"
pipx = "1.16.7" # yamllint's pipx: backend needs this installed explicitly
shellcheck = "0.11.0"
yamllint = "1.38.0"

# Python tooling
ruff = "0.16.4"
uv = "0.12.5"

# Kubernetes
helm = "4.2.4"
k9s = "0.51.0"
kind = "0.32.0"
kubectl = "1.36.4"
kubectx = "0.11.0"
kubens = "0.11.0"
"github:vladimirvivien/ktop" = "0.5.3"
cilium-cli = "0.19.7"
"github:cilium/hubble" = "1.19.4"
argocd = "3.5.1"

# Infrastructure as code
terraform = "1.15.9"
terragrunt = "1.1.3"
tflint = "0.64.0"

# Containers and security
lazydocker = "0.25.2"
trivy = "0.74.0"
go = "1.26.5"
